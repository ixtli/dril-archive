name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install

      - name: Build normalizer and builder
        run: cargo build --release -p dril-normalizer -p dril-builder

      - name: Clone dril archive
        run: git clone --depth 1 https://github.com/codemasher/dril-archive.git /tmp/dril-archive

      - name: Normalize archive
        run: ./target/release/dril-normalizer --source codemasher --input /tmp/dril-archive/.build/dril.json --output-dir data/

      - name: Build database
        run: ./target/release/dril-builder data/ site/dril.db

      - name: Copy SQLite WASM runtime
        run: |
          mkdir -p site/sqlite3
          cp node_modules/@sqlite.org/sqlite-wasm/dist/index.mjs site/sqlite3/
          cp node_modules/@sqlite.org/sqlite-wasm/dist/sqlite3.wasm site/sqlite3/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
