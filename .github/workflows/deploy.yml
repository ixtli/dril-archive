name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install

      - name: Install site dependencies
        run: cd site && bun install

      - name: Build all tools
        run: cargo build --release -p dril-normalizer -p dril-builder -p dril-bsky-sync

      - name: Clone dril archive
        run: git clone --depth 1 https://github.com/codemasher/dril-archive.git /tmp/dril-archive

      - name: Normalize archive
        run: ./target/release/dril-normalizer --source codemasher --input /tmp/dril-archive/.build/dril.json --output-dir data/

      - name: Sync Bluesky posts
        run: ./target/release/dril-bsky-sync --output data/scraped/bsky-dril-live.jsonl

      - name: Append scraped data
        run: |
          for f in data/scraped/*.jsonl; do
            [ -f "$f" ] && python3 scripts/split_manual_scrape.py "$f" data/
          done

      - name: Build database
        run: |
          mkdir -p site/vendor
          ./target/release/dril-builder data/ site/vendor/dril.db

      - name: Copy SQLite WASM runtime
        run: |
          mkdir -p site/vendor/sqlite3
          cp site/node_modules/@sqlite.org/sqlite-wasm/dist/index.mjs site/vendor/sqlite3/
          cp site/node_modules/@sqlite.org/sqlite-wasm/dist/sqlite3.wasm site/vendor/sqlite3/

      - name: Build Svelte app
        run: cd site && bunx vite build

      - name: Copy vendor assets into dist
        run: |
          cp site/vendor/dril.db site/dist/
          cp -r site/vendor/sqlite3 site/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
